<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <!-- Background Gradient (Sunny Schoolyard) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="60%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>

    <!-- Warm Pixar Skin & Clothes Gradients -->
    <radialGradient id="skin1" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fba866" />
    </radialGradient>
    <radialGradient id="skin2" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </radialGradient>

    <linearGradient id="shirtBoy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="shirtGirl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <linearGradient id="benchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bgGrad)" />

  <!-- Schoolyard Trees & Sunshine -->
  <circle cx="150" cy="120" r="80" fill="#fef08a" opacity="0.8" />
  <circle cx="150" cy="120" r="45" fill="#fde047" />

  <!-- School Tree Left -->
  <rect x="80" y="320" width="35" height="220" fill="#78350f" rx="8" />
  <circle cx="100" cy="280" r="110" fill="#22c55e" opacity="0.9" />
  <circle cx="140" cy="240" r="90" fill="#4ade80" />

  <!-- School Tree Right -->
  <rect x="870" y="320" width="35" height="220" fill="#78350f" rx="8" />
  <circle cx="890" cy="280" r="110" fill="#22c55e" opacity="0.9" />
  <circle cx="850" cy="240" r="90" fill="#4ade80" />

  <!-- Green Grass Lawn -->
  <path d="M 0 520 Q 500 480 1000 520 L 1000 700 L 0 700 Z" fill="#4ade80" />

  <!-- Modern Wooden Picnic Bench -->
  <rect x="240" y="460" width="520" height="30" rx="6" fill="url(#benchGrad)" filter="url(#cardShadow)" />
  <rect x="280" y="490" width="25" height="150" fill="#451a03" />
  <rect x="690" y="490" width="25" height="150" fill="#451a03" />

  <!-- Title Badge (Exemplo Cotidiano de Aplicação) -->
  <g transform="translate(500, 55)" filter="url(#cardShadow)">
    <rect x="-320" y="-25" width="640" height="50" rx="15" fill="#ffffff" />
    <text x="0" y="8" font-family="'Fredoka', 'Nunito', Arial, sans-serif" font-weight="800" font-size="22px" fill="#0369a1" text-anchor="middle">🏫 Exemplo no Cotidiano: Partilhando o Lanche na Escola</text>
  </g>

  <!-- Boy on Left (Offering Half of His Sandwich) -->
  <g transform="translate(380, 390)">
    <!-- Body / Shirt -->
    <path d="M -55 50 Q 0 35 55 50 L 45 130 Q 0 135 -45 130 Z" fill="url(#shirtBoy)" />
    <!-- Arms -->
    <path d="M 40 60 Q 90 70 120 60" fill="none" stroke="url(#shirtBoy)" stroke-width="26" stroke-linecap="round" />
    <circle cx="120" cy="60" r="16" fill="url(#skin1)" />
    <!-- Neck -->
    <rect x="-16" y="25" width="32" height="30" fill="url(#skin1)" rx="6" />
    <!-- Head -->
    <circle cx="0" cy="-20" r="55" fill="url(#skin1)" />
    <!-- Hair (Spiky Brown Pixar Boy Hair) -->
    <path d="M -58 -25 C -55 -80, 55 -80, 58 -25 C 62 -55, 30 -85, 0 -85 C -30 -85, -62 -55, -58 -25 Z" fill="#451a03" />
    <path d="M -50 -40 Q -30 -65 -10 -45 Q 10 -65 30 -45 Q 50 -60 55 -30" fill="#5c2406" />
    <!-- Smiling Eyes -->
    <ellipse cx="-18" cy="-22" rx="7" ry="9" fill="#1e293b" />
    <circle cx="-16" cy="-24" r="3" fill="#ffffff" />
    <ellipse cx="18" cy="-22" rx="7" ry="9" fill="#1e293b" />
    <circle cx="20" cy="-24" r="3" fill="#ffffff" />
    <!-- Big Friendly Smile -->
    <path d="M -20 5 Q 0 24 20 5" fill="none" stroke="#b45309" stroke-width="4.5" stroke-linecap="round" />
    <path d="M -18 6 Q 0 20 18 6 Z" fill="#ef4444" />
    <!-- Rosy Cheeks -->
    <circle cx="-32" cy="-4" r="9" fill="#f87171" opacity="0.4" />
    <circle cx="32" cy="-4" r="9" fill="#f87171" opacity="0.4" />
  </g>

  <!-- Girl on Right (Joyfully Receiving and Holding an Apple) -->
  <g transform="translate(620, 395)">
    <!-- Body / Shirt -->
    <path d="M -55 50 Q 0 35 55 50 L 45 130 Q 0 135 -45 130 Z" fill="url(#shirtGirl)" />
    <!-- Arms -->
    <path d="M -40 60 Q -90 70 -120 60" fill="none" stroke="url(#shirtGirl)" stroke-width="26" stroke-linecap="round" />
    <circle cx="-120" cy="60" r="16" fill="url(#skin2)" />
    <!-- Neck -->
    <rect x="-16" y="25" width="32" height="30" fill="url(#skin2)" rx="6" />
    <!-- Head -->
    <circle cx="0" cy="-20" r="55" fill="url(#skin2)" />
    <!-- Hair (Cute Braided Pixar Pigtails) -->
    <path d="M -58 -25 C -55 -80, 55 -80, 58 -25 Z" fill="#1c1917" />
    <!-- Pigtails -->
    <ellipse cx="-65" cy="5" rx="18" ry="35" fill="#1c1917" transform="rotate(20, -65, 5)" />
    <circle cx="-60" cy="-15" r="8" fill="#f43f5e" />
    <ellipse cx="65" cy="5" rx="18" ry="35" fill="#1c1917" transform="rotate(-20, 65, 5)" />
    <circle cx="60" cy="-15" r="8" fill="#f43f5e" />
    <!-- Smiling Eyes -->
    <ellipse cx="-18" cy="-22" rx="7" ry="9" fill="#1e293b" />
    <circle cx="-16" cy="-24" r="3" fill="#ffffff" />
    <ellipse cx="18" cy="-22" rx="7" ry="9" fill="#1e293b" />
    <circle cx="20" cy="-24" r="3" fill="#ffffff" />
    <!-- Joyful Smile -->
    <path d="M -20 5 Q 0 24 20 5" fill="none" stroke="#b45309" stroke-width="4.5" stroke-linecap="round" />
    <path d="M -18 6 Q 0 20 18 6 Z" fill="#ef4444" />
    <!-- Rosy Cheeks -->
    <circle cx="-32" cy="-4" r="9" fill="#f87171" opacity="0.4" />
    <circle cx="32" cy="-4" r="9" fill="#f87171" opacity="0.4" />
  </g>

  <!-- The Shared Lunchbox and Sandwich on the Table -->
  <g transform="translate(500, 445)" filter="url(#cardShadow)">
    <!-- Lunchbox -->
    <rect x="-70" y="-20" width="140" height="35" rx="10" fill="#3b82f6" />
    <rect x="-65" y="-15" width="130" height="8" rx="4" fill="#60a5fa" />
    <!-- The Sandwich (Split in half to share) -->
    <polygon points="-35,-20 -5,-45 25,-20" fill="#fef08a" stroke="#ca8a04" stroke-width="3" />
    <rect x="-30" y="-28" width="50" height="8" rx="3" fill="#ef4444" />
    <rect x="-32" y="-23" width="54" height="6" rx="2" fill="#22c55e" />
    <!-- Shiny Red Apple -->
    <circle cx="65" cy="-25" r="18" fill="#dc2626" />
    <circle cx="60" cy="-30" r="5" fill="#fca5a5" />
    <path d="M 65 -43 Q 72 -50 78 -45" fill="none" stroke="#15803d" stroke-width="3.5" />
  </g>

  <!-- Subtitle Tagline Card at Bottom -->
  <g transform="translate(500, 645)" filter="url(#cardShadow)">
    <rect x="-380" y="-25" width="760" height="50" rx="12" fill="#ffffff" opacity="0.95" />
    <text x="0" y="8" font-family="'Nunito', Arial, sans-serif" font-weight="700" font-size="18px" fill="#15803d" text-anchor="middle">"Quando compartilhamos o nosso lanche com alegria, praticamos o amor de Jesus!"</text>
  </g>
</svg>
